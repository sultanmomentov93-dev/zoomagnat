

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЗооМагнат</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #10251b; color: #fff;
      font-family: Arial, sans-serif;
    }
    main { max-width: 520px; margin: auto; }
    h1 { color: #b9f27c; text-align: center; }
    .card {
      background: #1d3b2b; padding: 16px;
      border-radius: 16px; margin: 12px 0;
    }
    .coins { font-size: 24px; color: #ffe58a; }
    button {
      background: #b9f27c; color: #10251b;
      border: 0; border-radius: 10px; padding: 12px;
      font-weight: bold; width: 100%; margin-top: 8px;
    }
    button:disabled { opacity: .5; }
    small { color: #c4d8c9; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>🦁 ЗооМагнат</h1>
  <div class="card">
    <h2>Твой зоопарк</h2>
    <p class="coins">🪙 <span id="coins">—</span> монет</p>
    <p>Доход: <span id="income">—</span> монет в минуту</p>
  </div>
  <p id="message">Загружаем игру...</p>
  <div id="animals"></div>
  <div class="card">
    <h3>📋 Как играть</h3>
    <p>Покупай животных и получай игровой доход.</p>
    <small>Монеты игровые, обмена на реальные деньги нет.</small>
  </div>
</main>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let busy = false;

async function api(path, method = "GET", body = null) {
  const initData = tg.initData;
  if (!initData) {
    throw new Error("Открой игру через Telegram, используя кнопку «Играть».");
  }

  const options = {
    method,
    headers: { "Authorization": "tma " + initData }
  };

  if (body !== null) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }

  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.detail || "Ошибка сервера: " + response.status);
  }
  return data;
}

function showMessage(text) {
  document.getElementById("message").textContent = text || "";
}

function render(state) {
  document.getElementById("coins").textContent = state.coins;
  document.getElementById("income").textContent =
    state.income_per_minute;

  const container = document.getElementById("animals");
  container.replaceChildren();

  state.animals.forEach(animal => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = animal.emoji + " " + animal.name;

    const quantity = document.createElement("p");
    quantity.textContent = "У тебя: " + animal.qty;

    const price = document.createElement("p");
    price.textContent = "Цена: " + animal.price + " монет";

    const income = document.createElement("p");
    income.textContent = "Доход: " + animal.income + " монет/мин";

    const button = document.createElement("button");
    button.textContent = "Купить";
    button.disabled = busy || state.coins < animal.price;
    button.addEventListener("click", () => buy(animal.key));

    card.append(title, quantity, price, income, button);
    container.append(card);
  });
}

async function loadGame() {
  try {
    const state = await api("/api/state");
    render(state);
    showMessage(state.notice || "");
  } catch (error) {
    showMessage("Не удалось загрузить игру.\n" + error.message);
  }
}

async function buy(animalKey) {
  if (busy) return;
  busy = true;
  showMessage("Покупаем животное...");

  try {
    const state = await api("/api/buy", "POST", {
      animal: animalKey
    });
    render(state);
    showMessage("Покупка успешно сохранена!");
  } catch (error) {
    showMessage("Покупка не выполнена.\n" + error.message);
  } finally {
    busy = false;
    try {
      const state = await api("/api/state");
      render(state);
    } catch (error) {
      showMessage("Не удалось обновить баланс.\n" + error.message);
    }
  }
}

loadGame();
</script>
</body>
</html>
