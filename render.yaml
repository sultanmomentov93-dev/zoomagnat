services:
  - type: web
    name: zoomagnat-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_PATH
        value: zoomagnat.db
